name: 📊 Daily Stock Analysis

on:
  schedule:
    # 12:30 PM UTC = 6:00 PM IST, Monday to Friday (after NSE close)
    - cron: '30 12 * * 1-5'
  workflow_dispatch:
    # Lets you run it any time from the Actions tab

permissions:
  contents: write

concurrency:
  group: daily-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Kolkata
    steps:
      - name: 🛒 Checkout repo
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Run daily analysis
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
        run: python run_daily.py

      - name: 💾 Save today's report to the repo
        if: always()
        run: |
          git config --global user.name "equity-research-copilot[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p reports
          git add reports/
          if git diff --staged --quiet; then
            echo "No new reports"
          else
            git commit -m "📊 Daily analysis $(date +'%Y-%m-%d %H:%M IST')"
            git pull --rebase --autostash
            git push
          fi
